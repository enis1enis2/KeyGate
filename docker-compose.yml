services:
  keygate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keygate
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Required: the gateway refuses to boot in production without a real key.
      - KEYGATE_MASTER_KEY=${KEYGATE_MASTER_KEY:?Set KEYGATE_MASTER_KEY in .env (min 16 chars)}
      # Required: bearer token for /api/* and /metrics.
      - KEYGATE_ADMIN_TOKEN=${KEYGATE_ADMIN_TOKEN:?Set KEYGATE_ADMIN_TOKEN in .env (min 16 chars)}
      - KEYGATE_REQUIRE_AUTH=${KEYGATE_REQUIRE_AUTH:-true}
      - KEYGATE_DB_PATH=/app/data/keygate.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - METRICS_RETENTION_DAYS=${METRICS_RETENTION_DAYS:-30}
      # CORS: empty means same-origin only. Comma-separated list of allowed origins.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Rate limiting (requests per window)
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-300}
      - RATE_LIMIT_V1_MAX=${RATE_LIMIT_V1_MAX:-120}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      # Multipart upload cap in bytes (audio transcriptions, image edits, file uploads)
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-67108864}
    volumes:
      - ./data:/app/data
      - ./providers:/app/providers:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
