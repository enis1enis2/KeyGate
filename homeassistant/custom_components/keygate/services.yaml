  fields:
    base_url:
      name: Base URL
      required: true
      selector:
        text:
    preset:
      name: Preset
      required: false
      selector:
        text:
    api_key:
      name: API key
      required: false
      selector:
        text:

test_provider:
  name: Test provider
  description: Live-test a provider spec, returning the mapped request and response.
  fields:
    spec_yaml:
      name: Provider spec (YAML)
      required: true
      selector:
        text:
          multiline: true
    test_key:
      name: Test key
      required: true
      selector:
        text:
    prompt:
      name: Prompt
      required: false
      selector:
        text:
    model:
      name: Model
      required: false
      selector:
        text:

quick_add_provider:
  name: Quick-add provider
