  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    preset:
      name: Preset
      required: true
      selector:
        text:
    base_url:
      name: Base URL
      required: true
      selector:
        text:
    model:
      name: Model
      required: true
      selector:
        text:
    api_key:
      name: API key
      required: false
      selector:
        text:
    description:
      name: Description
      required: false
      selector:
        text:
    pool_name:
      name: Pool name
      required: false
      selector:
        text:
    chat_path:
      name: Chat path
      required: false
      selector:
        text:
    preserveRoot:
      name: Preserve root
      required: false
      selector:
        boolean:
    timeout_ms:
      name: Timeout (ms)
      required: false
      selector:
        number:
          min: 1000
          mode: box

upsert_pricing:
  name: Create/update pricing
  fields:
    provider_id:
      name: Provider ID
      required: true
      selector:
        text:
    model:
      name: Model
      required: true
      selector:
        text:
    input_per_mtok:
      name: Input USD / Mtok
      required: true
      selector:
        number:
          min: 0
          mode: box
    output_per_mtok:
      name: Output USD / Mtok
      required: true
      selector:
        number:
          min: 0
          mode: box
